name: Manual PR Build (Android)

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment on (optional for manual runs)"
        required: false

concurrency:
  group: manual-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-pr-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Prepare env file
        run: |
          if [ -n "${{ secrets.ACCESS_TOKEN_GITHUB }}" ]; then
            curl -L \
              -H "Accept: application/vnd.github.object" \
              -H "Authorization: Bearer ${{ secrets.ACCESS_TOKEN_GITHUB }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o .env \
              https://raw.githubusercontent.com/bithyve/bitcoin-tribe-envs/DEVELOPMENT/.env.app
          else
            touch .env
          fi

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Comment APK artifact URL on PR
        if: github.event_name == 'pull_request' || github.event.inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          APK_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_apk.outputs.artifact-id }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER)
            if (!prNumber) {
              core.setFailed('PR number is missing. Provide workflow_dispatch input "pr_number" when running manually.')
              return
            }

            const body = [
              '### PR Build Artifacts',
              '',
              `Android APK: ${process.env.APK_ARTIFACT_URL}`,
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
              '<!-- manual-pr-build-artifacts -->'
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            })

            const existing = comments.find((c) => c.body && c.body.includes('<!-- manual-pr-build-artifacts -->'))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              })
            }
