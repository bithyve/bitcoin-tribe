schema: spec-driven

context: |
  # Bitcoin Tribe — React Native Bitcoin Wallet

  ## Tech Stack
  - React Native 0.81.5, React 19, TypeScript
  - State: React Context (AppContext, LocalizationContext) for global app state;
    React Query (react-query) for server/async data — no Redux, do not reintroduce it
  - Storage: Realm DB (encrypted via react-native-keychain), current schemaVersion: 99;
    MMKV (react-native-mmkv) for lightweight key-value storage
  - Navigation: React Navigation 6 — native-stack + bottom-tabs
  - Secure secrets: react-native-keychain (ACCESSIBLE.WHEN_UNLOCKED)
  - Styling: custom StyleSheet with src/theme/Colors.ts; no CSS-in-JS
  - Imports: use absolute src/... imports. The project also supports ~... alias via Babel,
    but src/... is the preferred convention.

  ## Key Domains
  - On-chain Bitcoin: wallets, UTXOs, transactions (bitcoinjs-lib 6.1.5)
  - RGB assets: coins (Coin), collectibles (Collectible), UDAs (UniqueDigitalAsset)
    issued/transferred via src/services/rgb/ and src/services/rgbnode/
  - P2P messaging: Hyperswarm via react-native-bare-kit; entry points are
    src/services/messaging/ and src/bare/
  - Community: channels, contacts, direct messages via HolepunchRoom/HolepunchMessage
  - Lightning (LN): NodeConnect mode, LNPayments schema
  - Backup: encrypted cloud backup + manual seed backup via src/services/backup/

  ## E2E Automation (Maestro)
  - E2E flows live under maestro/flows/ and cover onboarding, home, wallet,
    RGB, settings, backup, and recovery journeys.
  - Primary regression suite: maestro/flows/regression/dev-regression.yaml
  - NPM command: npm run maestro:test:regression-dev
  - Dev app id used by flows: com.bithyve.tribe.dev
  - Some flows are platform-specific (Android-only steps exist in regression composition).

  ## Realm Schemas
  - Source of truth: src/storage/realm/schema/index.ts
  - Do not maintain a partial static list in specs/design docs. When listing impacted
    schemas for a change, derive names from schema/index.ts and include only affected items.

  ## AppType Enum
  ON_CHAIN | NODE_CONNECT | SUPPORTED_RLN

  ## Critical Rules (non-negotiable)
  1. `yarn bare-pack` MUST run after any change to src/services/messaging/ or src/bare/
     Script: npx bare-pack --host ios --host android --linked ...
  2. Realm schema changes require BOTH a schemaVersion bump (realm.ts) AND
     a migration function in schema/migrations.ts — never bump version without a migration
  3. Never log, transmit, or store primaryMnemonic / primarySeed / encryption keys
     in plaintext; these fields exist in TribeApp schema and must stay encrypted
  4. Sensitive key material is stored via react-native-keychain — use Keychain.ACCESSIBLE.WHEN_UNLOCKED

  ## Conventions
  - Conventional commits: feat:, fix:, chore:, refactor:, test:, docs:
  - All new business logic must have Jest unit tests
  - Use src/ path alias in all imports, never relative ../../ beyond one level
  - React Context state: add to AppContext only if truly global; prefer local state or React Query
  - Screen components live in src/screens/<domain>/; reusable UI in src/components/

  ## Testing
  - Runner: Jest
  - Library: React Native Testing Library
  - Mocks: use project-level __mocks__/ or test-local mocks aligned with current Jest setup
  - Run: yarn test

rules:
  proposal:
    - State whether this change touches Realm schema (yes/no)
    - State whether this change touches src/services/messaging/ or src/bare/ (yes/no)
    - State whether this change affects existing Maestro flows (yes/no) and list affected flow files
    - Include a "Non-goals" section
    - Include an "Assumptions" section when behavior is inferred from code instead of directly observed
    - Include a rollback plan if the change modifies persistent storage or auth
  specs:
    - Use Given/When/Then format for all scenarios
    - Distinguish between on-chain and RGB/asset behavior where relevant
    - Add at least one failure/edge scenario for send, backup, restore, auth, and transfer requirements
  design:
    - If yarn bare-pack is required, call it out explicitly at the top of the file
    - If Realm schema changes, list all affected schema files and the new schemaVersion
    - For each schemaVersion bump, add a new guarded block in schema/migrations.ts
    - For each schemaVersion bump, add or update migration tests validating upgrade behavior
    - If user-visible flows change, list Maestro flows to update under maestro/flows/
    - List all files to be created or modified
  tasks:
    - Number tasks hierarchically: 1.1, 1.2, 2.1, 2.2, etc.
    - Include explicit verification tasks: yarn test, and yarn bare-pack when messaging/bare changes are present
    - Include Maestro verification tasks when UI/navigation/critical user journeys are impacted